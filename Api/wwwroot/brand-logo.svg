    <path d="M68 460 L20 490 L112 524 L222 472 L170 447 Z" fill="#E7ECFA"/>
    <path d="M20 490 L112 524 L222 472 L205 505 L113 550 L20 520 Z" fill="url(#blue)" opacity=".92"/>
