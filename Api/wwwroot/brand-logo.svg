  <text x="400" y="585" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="88" font-weight="900" letter-spacing="8" fill="url(#navy)">NPTEL</text>
  <text x="400" y="635" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="10" fill="#17315F">MANAGEMENT SYSTEM</text>
  <path d="M160 677 H270" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="291" cy="677" r="4" fill="#E7B64A"/>
  <text x="400" y="685" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="5" fill="#17315F">LEARN · TRACK · ACHIEVE</text>
  <circle cx="509" cy="677" r="4" fill="#E7B64A"/>
  <path d="M530 677 H640" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
</svg>