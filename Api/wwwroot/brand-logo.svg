    <path d="M205 160 L420 210 L420 430 L205 430 Z" fill="url(#navy)" opacity=".56"/>

    <path d="M420 210 C500 210 565 188 620 150 L620 230 C566 286 500 316 420 318 Z" fill="url(#navy)" stroke="#1746AE" stroke-width="4"/>
    <path d="M420 210 C500 210 565 188 620 150 L620 190 C560 238 495 258 420 262 Z" fill="url(#gold)"/>

    <path d="M280 214 L360 236 L360 316 L280 294 Z" fill="#0B2A75"/>
