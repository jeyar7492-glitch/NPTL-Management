# NPTEL Management System - Render Blueprint
# The existing Render Postgres resource is declared here so the Blueprint can
# manage the existing database and inject its connection string into the web service.

services:
  - type: web
    name: NPTL-Management
    runtime: docker
    repo: https://github.com/jeyar7492-glitch/NPTL-Management
    branch: pwa-phase1
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: USE_INMEMORY_DB
        value: "false"
      - key: ENABLE_BACKGROUND_WORKER
        value: "true"
      - key: AUTO_INITIALIZE_DB
        value: "true"
      - key: JWT_ISSUER
        value: NPTELManagementApi
      - key: JWT_AUDIENCE
        value: NPTELManagementClient
      - key: SUPABASE_DB_CONNECTION
        fromDatabase:
          name: NPTL-Management-DB
          property: connectionString

databases:
  - name: NPTL-Management-DB
    plan: free
    region: oregon
    version: 17
    diskSizeGB: 1
