# NPTEL Management System - Render Blueprint
# Existing Render resources are referenced by name so a Blueprint sync can wire
# the web service to the persistent Render Postgres database.
services:
  - type: web
    name: NPTL-Management
    runtime: docker
    repo: https://github.com/jeyar7492-glitch/NPTL-Management
    branch: pwa-phase1
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    autoDeploy: true
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: USE_INMEMORY_DB
        value: "false"
      - key: ENABLE_BACKGROUND_WORKER
        value: "true"
      - key: AUTO_INITIALIZE_DB
        value: "true"
      - key: SEED_MODE
        value: clean
      - key: JWT_ISSUER
        value: NPTELManagementApi
      - key: JWT_AUDIENCE
        value: NPTELManagementClient
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_DB_CONNECTION
        fromDatabase:
          name: NPTL-Management-DB
          property: connectionString

databases:
  - name: NPTL-Management-DB
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    databaseName: nptl_management_db
    user: nptl_management_db_user
